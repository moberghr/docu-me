name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The renderer's tests decide for themselves whether this machine can render: they look for
      # node_modules/beautiful-mermaid and Assert.SkipUnless it is there (BundledRenderScript), so a
      # runner without it does not go red — it reports 7 fewer tests and stays green. node_modules/
      # is gitignored, so before these two steps that was every CI run this workflow has ever
      # described. The dependency is exactly the one whose dialect support is the open question in
      # state.json -> decisions.mermaidDialectGap, which is to say the part of the renderer most
      # likely to move under us. ~1 s to install 3 packages; no browser, no native build.
      - name: Setup Node for the mermaid renderer
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the mermaid renderer's toolchain
        run: npm ci

      - name: Restore
        run: dotnet restore DocuMe.slnx

      - name: Build
        run: dotnet build DocuMe.slnx --configuration Release --no-restore

      # xUnit v3 on the Microsoft Testing Platform (global.json test.runner): in MTP mode
      # `dotnet test` takes the solution via --solution, not positionally.
      - name: Test
        run: dotnet test --solution DocuMe.slnx --configuration Release --no-build --verbosity normal

      # BuildStandardsTests reads Directory.Build.props and .editorconfig, so it proves only that
      # nothing has been *configured* to stop the analyzers. It cannot prove one still runs, and a
      # pack that fails to load says nothing at all: no diagnostic, no warning, a green build that
      # enforces less than it did yesterday. /p:ReportAnalyzer=true prints the analyzer assemblies
      # that actually executed, per compilation, and the script fails when a house pack is missing
      # from any of them. It is here rather than in the suite because it needs a --no-incremental
      # rebuild of the same assemblies the test host has loaded; ~6 s for all three projects.
      - name: Verify the analyzer packs ran
        run: tools/verify-analyzers.sh

  # Schema-checks the two plugin manifests with Claude Code's own validator, which is the
  # only thing that catches a mistyped or wrong-typed field: PluginManifestTests covers the
  # structural half (manifest location, version agreement, skills discoverable, and the
  # marketplace `source` actually resolving — which the validator does NOT check), but it
  # cannot tell `homepage` from `homepag`. Both layers are needed; neither subsumes the other.
  #
  # No ANTHROPIC_API_KEY: `plugin validate` is an offline schema check, verified to pass with
  # HOME and CLAUDE_CONFIG_DIR pointed at an empty dir and no credentials in the environment.
  #
  # The CLI is pinned so a Claude Code release cannot turn this red on an untouched manifest.
  # To bump: raise the version here, run both commands locally, fix anything new it reports.
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.219

      - name: Validate plugin manifest
        run: claude plugin validate ./plugin --strict

      - name: Validate marketplace manifest
        run: claude plugin validate ./ --strict
