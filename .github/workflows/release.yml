# DocuMe — release (PLAN.md §12). One tag `vX.Y.Z` releases CLI, Core and the plugin off a single
# version: tag → verify → build → test → pack → push NuGet → GitHub Release.
#
# HOW TO RELEASE. Three files carry the version and all three are bumped in one commit on `main`:
#
#   1. Directory.Build.props   <Version>X.Y.Z</Version>        — the packages
#   2. plugin/.claude-plugin/plugin.json   "version": "X.Y.Z"  — the plugin Claude Code caches
#   3. plugin/README.md        the git-subdir "ref": "vX.Y.Z"  — the Moberg marketplace entry
#
# then `git tag vX.Y.Z && git push origin vX.Y.Z`. The first step below refuses the release if the
# tag and those three disagree, which is the whole point of having it: a plugin pinned to a version
# that was never released is one Claude Code keeps its cached copy of forever, and it fails silently.
# `PluginManifestTests` catches (1) vs (2) at desk time; only the tag can be checked here.
#
# The last step then force-moves the floating major tag (`v0` now, `v1` from 1.0.0 on) so §12's
# `moberghr/docu-me/actions@vN` resolves to this release. That is rule §8.2's one exception, §8.2a.
#
# WHAT THIS WORKFLOW CANNOT DO: update the Moberg marketplace. That marketplace is a different
# repository, so §12's "plugin marketplace ref update" is a copy-paste — the release notes carry the
# exact entry, with `ref` already set to this tag. See plugin/README.md.
name: release

on:
  push:
    # Tags only, and deliberately no `branches:` — a release workflow that also fired on push to main
    # would publish a package from every commit. CI (ci.yml) is the one that runs on branches, and it
    # does not run for tags, so the build and test below are not a duplicate of it.
    tags:
      - 'v*.*.*'

# Two tags pushed close together would otherwise race for the same package version. Not
# cancel-in-progress: a run that has already pushed to the feed must finish and cut its release.
concurrency:
  group: docume-release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release (and read the repo)
  packages: write # push to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Packages. GITHUB_TOKEN is enough for the owner's own feed, which is why it needs no
      # secret. It is no longer the only feed: §12's "nuget.org when opened up" is the second push
      # step below, and the packages themselves needed no change for it.
      FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      # Job level, not step level: a step's own `env:` is not dependably in scope for that step's
      # `if:`, and the nuget.org push is gated on this being non-empty.
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      PACKAGES: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # First, and before anything expensive: the failure this catches is a half-bumped release, and
      # every later step would happily succeed on one.
      - name: Verify the tag is the single version
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          props=$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' Directory.Build.props)
          manifest=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          # The `ref` of the git-subdir entry in plugin/README.md — the copy-pasteable Moberg
          # marketplace entry. Nothing reads it at build time, so a stale one is invisible until
          # somebody pastes it and installs a version-old plugin.
          readme=$(sed -n 's|.*"ref": *"\([^"]*\)".*|\1|p' plugin/README.md)
          readme=${readme%%$'\n'*} # first match only; piping to `head` would race pipefail

          ok=1
          [ "$props" = "$version" ] || { echo "::error::Directory.Build.props <Version> is $props, tag is $tag."; ok=0; }
          [ "$manifest" = "$version" ] || { echo "::error::plugin/.claude-plugin/plugin.json version is $manifest, tag is $tag."; ok=0; }
          [ "$readme" = "$tag" ] || { echo "::error::plugin/README.md marketplace ref is $readme, tag is $tag."; ok=0; }

          if [ "$ok" -ne 1 ]; then
            echo "::error::Bump all three to $version, commit, delete and re-push the tag."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: dotnet restore DocuMe.slnx

      - name: Build
        run: dotnet build DocuMe.slnx --configuration Release --no-restore

      # Before the pack, never after: a package that is already on the feed cannot be unpublished,
      # so the tests are the last point at which a bad release is still cheap (rule §8.3 in CI form).
      # xUnit v3 on the Microsoft Testing Platform (global.json test.runner): in MTP mode
      # `dotnet test` takes the solution via --solution, not positionally.
      - name: Test
        run: dotnet test --solution DocuMe.slnx --configuration Release --no-build --verbosity normal

      # Only DocuMe.Core and DocuMe.Cli are packable; both test projects set IsPackable=false, so the
      # glob below cannot pick up a test assembly by accident.
      - name: Pack
        run: dotnet pack DocuMe.slnx --configuration Release --no-build --output "$PACKAGES"

      # --skip-duplicate so a re-run after a failed release step is a no-op here rather than a 409.
      - name: Push to GitHub Packages
        run: dotnet nuget push "$PACKAGES/*.nupkg" --source "$FEED" --api-key "$GH_TOKEN" --skip-duplicate

      # The public feed, now that the repository is public: `dotnet tool install --global DocuMe.Cli`
      # with no feed setup and no PAT is the install story the README documents, and GitHub Packages
      # cannot serve it because that feed authenticates every read. Both pushes run: the GitHub feed
      # stays the one the scaffolded workflows restore a pinned version from.
      #
      # Same mechanism as Beacon (.github/workflows/w-build.yml there): the NUGET_API_KEY organisation
      # secret, api.nuget.org, --skip-duplicate. Being an org secret is why nothing repo-level has to
      # be created here, and also the one thing that can quietly go wrong: an org secret scoped to
      # selected repositories, or to private ones, does not reach this public repo.
      #
      # Skipped, not failed, when the key is absent, so a release still cuts before it is granted.
      # `continue-on-error` is deliberately NOT used: with the key present, a rejected push is a
      # release that must go red rather than one that quietly ships to one feed only.
      - name: Push to nuget.org
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "$PACKAGES/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
          echo "Pushed to nuget.org." >> "$GITHUB_STEP_SUMMARY"

      # The other half of that gate, and the point of it: a release that published to one feed only
      # has to say so. Without this, the skip is invisible in a green run, and the README's install
      # line — a bare `dotnet tool install --global DocuMe.Cli` — is untrue for this version with
      # nothing anywhere recording that.
      - name: Say so when nuget.org was skipped
        if: env.NUGET_API_KEY == ''
        run: |
          echo "::warning title=Not on nuget.org::NUGET_API_KEY was empty, so $GITHUB_REF_NAME went to GitHub Packages only. The README documents a bare 'dotnet tool install --global DocuMe.Cli', which needs nuget.org. Check that the organisation secret's repository access includes this repo."
          {
            echo "### nuget.org: skipped"
            echo
            echo "\`NUGET_API_KEY\` resolved empty, so this release is on GitHub Packages only."
            echo "The org secret's repository access has to include a public repo for it to reach here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cut the GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"

          # The marketplace entry a human pastes into the Moberg marketplace repository, built BY jq out
          # of plugin.json rather than hand-interpolated into the heredoc below. Two of its fields are
          # prose that lives in a json file: a description carrying a double quote wrote invalid json
          # into the release notes, and the paste then fails at install time — the one failure
          # PluginManifestTests structurally cannot see, because the manifest itself stays valid. jq
          # escapes both values and is already in this step. Expanding its result also keeps the
          # backticks around `docume` literal for free: bash does not rescan an expanded value, so the
          # description needs none of the hand-escaping the rest of this unquoted heredoc does.
          entry=$(jq \
            --arg url "https://github.com/$GITHUB_REPOSITORY.git" \
            --arg ref "$TAG" \
            '{name, source: {source: "git-subdir", url: $url, path: "plugin", ref: $ref},
              description, category: "documentation"}' \
            plugin/.claude-plugin/plugin.json)

          # The install story of this exact version, written into the release rather than left in a
          # README that describes whatever `main` currently is.
          cat > "$notes" <<EOF
          ## Install

          \`\`\`
          dotnet tool install --global DocuMe.Cli --version $VERSION
          \`\`\`

          From nuget.org, which needs no feed setup and no token.

          <details><summary>From GitHub Packages instead</summary>

          \`\`\`
          dotnet tool install --global DocuMe.Cli --version $VERSION --add-source $FEED
          \`\`\`

          That feed authenticates every read, including public ones, so it needs a PAT with
          \`read:packages\` in your NuGet config first. It is also the feed the scaffolded workflows
          restore from.

          </details>

          Or, pinned per repository (what \`docume init\` scaffolds): \`.config/dotnet-tools.json\` +
          \`dotnet tool restore\`.

          ## Claude Code plugin

          \`\`\`
          /plugin marketplace add ${GITHUB_REPOSITORY}
          /plugin install docume@docume
          \`\`\`

          To publish this version through the Moberg marketplace, add or update this entry in that
          repository's \`.claude-plugin/marketplace.json\` — \`ref\` is the only field a release changes:

          \`\`\`json
          $entry
          \`\`\`
          EOF

          # --generate-notes appends the commit log below the notes above; --verify-tag refuses to
          # invent a tag if this ever runs somewhere the tag does not exist.
          gh release create "$TAG" "$PACKAGES"/*.nupkg \
            --title "$TAG" \
            --notes-file "$notes" \
            --generate-notes \
            --verify-tag

          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      # The floating major ref of the composite action, `actions/action.yml` — §12 promises consumers
      # `moberghr/docu-me/actions@v1` and a floating ref only floats if something moves it.
      #
      # LAST, AND DELIBERATELY AFTER THE RELEASE. The action's own job is `dotnet tool restore`, so a
      # major ref pointing at a commit whose packages never reached the feed turns every consumer's
      # docs job red. Every step above this one can fail; none of them can fail after it.
      #
      # THE FORCE-PUSH IS AUTHORIZED HERE AND NOWHERE ELSE: rule §8.2a, one narrow exception to §8.2,
      # scoped to this tag, on the runner, with GITHUB_TOKEN (`contents: write`, line 35 — no new
      # grant). It never touches branch history, and the loop's own shell still may not force-push.
      - name: Move the floating major tag
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # A prerelease must not become what `@vN` resolves to: the floating ref advertises the
          # newest *stable* major, and `v*.*.*` up there matches `v1.0.0-rc.1` too.
          case "$VERSION" in
            *-*)
              echo "$TAG is a prerelease — leaving the floating major tag where it is." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # Derived, not hardcoded to `v1`: this releases 0.x today, and a `v1` pointing at 0.1.0
          # would advertise a 1.x that does not exist. `@v0` before 1.0.0, `@v1` from 1.0.0 on, and
          # `v1` correctly stops moving when 2.0.0 ships. §12's `@v1` goes live at 1.0.0.
          major="v${VERSION%%.*}"

          # Lightweight: an annotated tag needs a committer identity this runner has not configured,
          # and there is nothing to annotate — the notes live on the release.
          git tag -f "$major"
          git push -f origin "$major"

          echo "\`$major\` now points at $TAG." >> "$GITHUB_STEP_SUMMARY"
