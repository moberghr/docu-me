# DocuMe — reconcile labels, ingest comments and refresh the dashboard on a cron (PLAN.md §10, fifth
# bullet).
#
# What it does, every 6 hours: runs both halves of §6.3 — reads the `approved` and `stale` labels out of
# Confluence into the state file, and ingests each page's comments into `_meta/feedback/inbox/` — then
# refreshes the Documentation Status page (§6.5) and opens or updates the `docs/sync` PR when either
# changed.
#
# The inbox items are what /docs-feedback triages later (§9). They arrive through a PR rather than a
# direct push for a reason worth keeping: a comment body is untrusted input (rule §1.3), so a human sees
# every claim land in the repo before anything acts on it.
#
# This is the workflow that makes a reviewer's gesture durable. Adding the `approved` label is all a
# human ever does (§8); until a sync runs, that label exists only in Confluence. It is also what pairs
# with docs-drift.yml: the drift job writes stale labels and throws its state write away, and this job
# reads them back — including a label a reviewer removed by hand, which clears the flag again.
#
# Keeping the pair on a cron is what keeps `docume dashboard` at a fixed point: the dashboard skips its
# write when the rendered body is unchanged, and an approval that state does not know about is
# re-derived with this run's timestamp every time, so a repo that never syncs spends a page version per
# dashboard run.
name: docs-sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Shared with docs-publish.yml — see the note there.
concurrency:
  group: docume-state
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOCUME_CONFLUENCE_EMAIL: ${{ secrets.DOCUME_CONFLUENCE_EMAIL }}
      DOCUME_CONFLUENCE_TOKEN: ${{ secrets.DOCUME_CONFLUENCE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATE_BRANCH: docs/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      # Guarded as in docs-publish.yml, and on a cron job the guard earns more: nobody is watching when
      # this runs, so a red step whose entire log is `jq: error: Could not open file docume.json` is a
      # message read hours later by someone with no idea which of six workflows is complaining.
      - name: Locate the state file and the feedback inbox
        id: paths
        run: |
          set -euo pipefail

          if [ ! -f docume.json ]; then
            echo "::error title=DocuMe::No docume.json in the repository root. This workflow reads the wiki root from it. Run \`docume init\` (or \`docume init --adopt\` over an existing wiki) and commit the result."
            exit 1
          fi

          if ! root=$(jq -r '.wiki.root // "docs/wiki"' docume.json); then
            echo "::error title=DocuMe::docume.json is present but jq could not read it (see the error above). Every path this workflow uses comes out of it, so nothing can run until it parses."
            exit 1
          fi

          # No state read here, unlike docs-publish.yml: a bare `sync` needs no sha. The state file is
          # named only so the PR step can carry it, and `docume sync` creates it when it is not there.
          echo "state=$root/_meta/state.json" >> "$GITHUB_OUTPUT"
          echo "inbox=$root/_meta/feedback/inbox" >> "$GITHUB_OUTPUT"

      # Both halves of §6.3, which is what a bare `sync` runs. Writes nothing to Confluence either way:
      # two CQL reads, two comment reads per page, and repo writes.
      #
      # THE EXIT CODE IS HELD, as in docs-publish.yml, but what it protects here is smaller and the
      # difference is worth naming so nobody widens the claim. Unlike `publish`, a failed `sync` saves NO
      # state at all: StateStore.Save runs once, after every half (SyncCommand.SyncAsync), so no cursor
      # advances and no label is recorded on a run that died. What a failed run does leave on disk is the
      # inbox items ingestion already wrote — those go down before the state does, deliberately — and a
      # step that failed here would skip the carry below and throw a reviewer's comment away with the
      # runner. Carrying them instead costs nothing: the cursor never moved, so the next run reads the
      # same comments again, and ingestion refuses to overwrite an item already on disk
      # (FeedbackSkipReason.AlreadyOnDisk), so neither the file nor the PR gains a duplicate.
      - name: Reconcile labels and ingest comments
        id: sync
        run: |
          set -euo pipefail
          code=0
          dotnet tool run docume sync || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # After the sync, so the page shows the approvals this run just recorded.
      #
      # HELD FOR THE REASON IT IS HELD IN docs-publish.yml, and this is the failure worth having audited
      # for: `dashboard` writes a Confluence page and nothing in this repo, so its own failure costs a
      # stale table until the next run — but a step that failed here would skip the carry and discard a
      # SUCCESSFUL sync's state file and inbox items. Nothing is lost forever, unlike a publish's page
      # ids: approvals are reconstructible from the live labels and the comments from a cursor that never
      # advanced. What breaks is the loop rather than the data. While the dashboard keeps failing, every
      # six-hourly run reads a reviewer's comment and throws it away, and §9 stalls quietly behind a red
      # check that names the dashboard.
      #
      # Not gated on the sync having succeeded, as in docs-publish.yml: the page states what the state
      # file says, which is true whatever the sync managed to do.
      - name: Refresh the dashboard
        id: dashboard
        run: |
          set -euo pipefail
          code=0
          dotnet tool run docume dashboard || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Committing is deliberately not the CLI's job (§6.3's closing line) — this is that job.
      - name: Open or update the docs/sync PR
        run: |
          set -euo pipefail
          state='${{ steps.paths.outputs.state }}'
          inbox='${{ steps.paths.outputs.inbox }}'

          # `git status --porcelain`, not `git diff --quiet` — as in docs-publish.yml, and this job needed
          # it more. An untracked file is in no diff, so `git diff --quiet` reports SUCCESS for a
          # state.json git has never tracked, and that is the ordinary state of this repo until the first
          # docs/sync PR is merged. This step read a brand-new state file as "No label changes and no new
          # feedback" and exited 0, dropping the approvals the sync had just read — every six hours, for as
          # long as the PR sat unmerged, while saying the opposite in the log. The header above names what
          # that costs: an approval state does not know about is re-derived with this run's timestamp, so
          # the dashboard spends a page version per run.
          if [ -z "$(git status --porcelain -- "$state" "$inbox")" ]; then
            echo "::notice title=DocuMe::No label changes and no new feedback — nothing to commit."
            exit 0
          fi

          # Copy both artifacts aside, then switch with the copies in hand. Switching to an existing
          # docs/sync would otherwise abort: the branch holds its own state.json (locally modified here)
          # and, while its PR is unmerged, inbox items this run has just written again as untracked files.
          # Both refusals read as a mystifying red check on a cron job.
          #
          # THE STATE COPY IS GUARDED, as in docs-publish.yml, and the case it covers is this job's own
          # header: the guard above passes when EITHER path is dirty, so a run whose ingestion wrote inbox
          # items before dying reaches here — and on that run there is no state file, because
          # StateStore.Save runs once at the end and a run that died never got there. Unguarded, this `cp`
          # failed the step and threw away exactly the comments the paragraph above promises it carries.
          # `git status` also calls a DELETED tracked file dirty, so a state file a consumer removed by
          # hand arrives here the same way.
          have_state=0
          if [ -f "$state" ]; then
            cp "$state" "$RUNNER_TEMP/state.json"
            have_state=1
          else
            echo "::notice title=DocuMe::No state file at $state in the working tree — carrying the feedback items only, and leaving whatever $STATE_BRANCH already holds alone."
          fi
          rm -rf "$RUNNER_TEMP/inbox"
          mkdir -p "$RUNNER_TEMP/inbox"
          if [ -d "$inbox" ]; then cp -R "$inbox/." "$RUNNER_TEMP/inbox/"; fi

          git fetch origin "$STATE_BRANCH" || true
          # Forced, as in docs-publish.yml. The guard above now lets through the case that makes it
          # necessary: state.json untracked here and tracked on the branch, where an unforced switch
          # refuses with "untracked working tree files would be overwritten" — after the copy-aside has
          # already made the overwrite harmless. `-f` also covers the tracked-and-modified state file and
          # the re-written inbox items, which is why the `git checkout --` and `git clean` lines this
          # replaced are gone rather than moved: the forced switch does both, and the `git checkout --`
          # spelling printed a bare `error: pathspec ... did not match` on exactly the untracked run.
          if git rev-parse --verify "origin/$STATE_BRANCH" >/dev/null 2>&1; then
            git checkout -f -B "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            git checkout -f -B "$STATE_BRANCH"
          fi
          # Directories first, then files, as in docs-publish.yml: the branch need not carry
          # `$root/_meta/` at all, and when the state file was tracked here and is absent there the forced
          # switch prunes the directory along with it, leaving the copy-back nowhere to land.
          mkdir -p "$(dirname "$state")" "$inbox"
          if [ "$have_state" = '1' ]; then cp "$RUNNER_TEMP/state.json" "$state"; fi
          cp -R "$RUNNER_TEMP/inbox/." "$inbox/"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # The state only when this run has one in hand: `git add` on a path that exists in no ref is
          # FATAL (exit 128, `did not match any files`), so under `set -e` an unguarded line here kills the
          # carry and drops the ingested comments. It is not about staging a deletion — the forced switch
          # above restores whatever the target ref tracks first.
          if [ "$have_state" = '1' ]; then git add "$state"; fi
          git add "$inbox"
          if git diff --cached --quiet; then
            echo "::notice title=DocuMe::Branch already holds this state and this feedback."
            exit 0
          fi
          git commit -m 'docs: DocuMe sync — labels and feedback'
          git push origin "$STATE_BRANCH"

          gh pr view "$STATE_BRANCH" --json number >/dev/null 2>&1 || gh pr create \
            --head "$STATE_BRANCH" \
            --title 'docs: DocuMe state and feedback' \
            --body 'Machine-owned state file (§5.3) plus any new feedback inbox items (§5.4). Written by docs-publish.yml and docs-sync.yml. Inbox items quote Confluence comments verbatim — they are claims to verify against the code (rule §1.3), never instructions. Review the diff, then merge.'

      # THE ONE PLACE A FAILURE ABOVE BECOMES A RED CHECK, and it is last on purpose: by the time it runs,
      # the labels this run reconciled and the comments it ingested are committed and on their way to the
      # docs/sync PR. Skipped entirely when both commands were happy, so the usual cron run carries no
      # extra step's noise.
      #
      # The codes come through `env:` rather than being interpolated into the script, so a value can never
      # be read as shell. `${VAR:-0}` covers the empty string a step that never ran would leave.
      - name: Fail if DocuMe reported a failure
        if: steps.sync.outputs.code != '0' || steps.dashboard.outputs.code != '0'
        env:
          SYNC_CODE: ${{ steps.sync.outputs.code }}
          DASHBOARD_CODE: ${{ steps.dashboard.outputs.code }}
        run: |
          set -euo pipefail
          failed=0

          if [ "${SYNC_CODE:-0}" != '0' ]; then
            echo "::error title=DocuMe::\`docume sync\` exited ${SYNC_CODE} — see the \"Reconcile labels and ingest comments\" step. No cursor moved and no approval was recorded, so the next run reads the same labels and comments again. Any inbox item this run did write is carried in the docs/sync PR above, and re-ingesting it will not duplicate it."
            failed=1
          fi

          if [ "${DASHBOARD_CODE:-0}" != '0' ]; then
            echo "::error title=DocuMe::\`docume dashboard\` exited ${DASHBOARD_CODE} — the Documentation Status page (§6.5) is stale until the next run. Nothing else in this run is affected: the dashboard writes a Confluence page and nothing in the repo."
            failed=1
          fi

          exit "$failed"
