# DocuMe — republish changed pages on merge to the default branch (PLAN.md §10, fourth bullet).
#
# What it does: publishes only the pages touched since the last publish, lets §6.2 step 7 invalidate
# the approvals on the pages whose content changed, answers the reviewers whose feedback shipped in
# this merge (§9 step 5), refreshes the Documentation Status page, and carries the machine-owned state
# file plus the answered feedback items back into the repo through the `docs/sync` PR.
#
# EDIT BEFORE USE: `branches:` must name your default branch, and `paths:` your wiki root if it is not
# docs/wiki.
#
# `--prune` is deliberately absent and must stay absent: orphan deletion needs interactive
# confirmation and never runs in CI (§6.2, rule §9.6). `docume publish --prune` refuses in a
# non-interactive session anyway, so a template that passed it would be written against a refusal.
name: docs-publish

on:
  push:
    branches: [main] # <- your default branch
    paths:
      - 'docs/wiki/**'

# Shared with docs-sync.yml: both workflows commit the state file to the same branch, and two runs
# pushing to it at once would make one of them lose. Not cancel-in-progress — a publish that is half
# way through writing pages must finish.
concurrency:
  group: docume-state
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCUME_CONFLUENCE_EMAIL: ${{ secrets.DOCUME_CONFLUENCE_EMAIL }}
      DOCUME_CONFLUENCE_TOKEN: ${{ secrets.DOCUME_CONFLUENCE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATE_BRANCH: docs/sync
    steps:
      # fetch-depth: 0 because --changed-since resolves a sha from an earlier publish, which a
      # depth-1 clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      # Every path this job uses is derived here, so this step is also where a repo that is not set up
      # says so. Both guards below replace a bare `jq:` line — the whole log a consumer used to get —
      # with a message naming the command that fixes it.
      - name: Locate the state file and the feedback directories
        id: paths
        run: |
          set -euo pipefail

          # Not a jq problem: a repo holding these workflows without the config they read is what
          # copying them in by hand rather than through `docume init` leaves behind.
          if [ ! -f docume.json ]; then
            echo "::error title=DocuMe::No docume.json in the repository root. This workflow reads the wiki root from it. Run \`docume init\` (or \`docume init --adopt\` over an existing wiki) and commit the result."
            exit 1
          fi

          # `if !` rather than a bare assignment, so `set -e` does not kill the step before the
          # annotation is written. jq's own parse error is already on stderr above it.
          if ! root=$(jq -r '.wiki.root // "docs/wiki"' docume.json); then
            echo "::error title=DocuMe::docume.json is present but jq could not read it (see the error above). Every path this workflow uses comes out of it, so nothing can run until it parses."
            exit 1
          fi

          state="$root/_meta/state.json"
          echo "state=$state" >> "$GITHUB_OUTPUT"

          # A missing state file is the first publish from this repo, not a failure, and the step below
          # is written for exactly that: no sha means no --changed-since to narrow with, so the whole
          # tree is the right scope. It already behaved that way — `set -e` does not see a command
          # substitution nested inside an argument, so jq's "Could not open file" went to stderr and the
          # empty sha still landed. What that cost was the log: an ordinary first run carried a line
          # that reads like a bug. A state file that EXISTS and will not parse is a different thing and
          # stays loud, because it holds the page ids.
          sha=''
          if [ -f "$state" ]; then
            if ! sha=$(jq -r '.lastPublishedSha // empty' "$state"); then
              echo "::error title=DocuMe::$state is present but jq could not read it (see the error above). It is machine-owned (§5.3) and holds the page id of every page published from here — if it was hand-edited, revert it rather than deleting it, and the docs/sync PR carries the good copy."
              exit 1
            fi
          else
            echo "::notice title=DocuMe::No state file at $state yet — treating this as the first publish from this repository."
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # Both, because the reply pass reads both and stamps whichever holds the item it answered:
          # §9 step 4 archives an item in the same PR that fixes the page, so by the time step 5 runs
          # the item is usually in the archive rather than the inbox.
          echo "inbox=$root/_meta/feedback/inbox" >> "$GITHUB_OUTPUT"
          echo "archive=$root/_meta/feedback/archive" >> "$GITHUB_OUTPUT"

      # No lastPublishedSha means nothing has ever been published from this repo, so there is no
      # "changed" to narrow to and the whole tree is the correct scope. Unchanged pages are skipped by
      # contentHash either way (§6.2 step 5), so the full run is cheap after the first one.
      #
      # THE EXIT CODE IS HELD, like the reply step's below, and for the sharper version of the same reason:
      # `docume publish` writes the state file BEFORE it reports a failure, deliberately (§6.2 step 8),
      # because a page id earned by a create cannot be earned again — lose it and the next run creates a
      # second page with the same title, which Confluence rejects. A run that failed on page seven is
      # therefore the run whose state file matters MOST, and a step that failed here would skip the carry
      # below and throw it away. The last step turns the held code into a red check.
      #
      # Held codes rather than `if: always()` on the carry, which would be the shorter spelling: always()
      # would also run the carry after a checkout or a restore failure, where there is no state file to
      # copy and the `cp` fails with something that reads like a DocuMe bug. Holding these three codes says
      # exactly which failures are survivable and leaves the rest to skip the carry, as they should.
      - name: Publish changed pages
        id: publish
        run: |
          set -euo pipefail
          since='${{ steps.paths.outputs.sha }}'
          code=0
          if [ -n "$since" ]; then
            dotnet tool run docume publish --changed-since "$since" || code=$?
          else
            echo "::notice title=DocuMe::No lastPublishedSha in state — publishing the whole tree."
            dotnet tool run docume publish || code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Held too, but the cost it is guarding is the other one's: `dashboard` writes a Confluence page and
      # nothing in this repo, so its own failure costs a stale table until the next run. What failing here
      # would cost is the carry, and with it the publish's state file — so it holds.
      #
      # Not gated on the publish having succeeded, unlike the reply: this page states what the state file
      # says, so it is true whatever the publish managed to do.
      - name: Refresh the dashboard
        id: dashboard
        run: |
          set -euo pipefail
          code=0
          dotnet tool run docume dashboard || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # §9 step 5, and this job is the only honest place for it. The reply says the reviewer's point is
      # fixed in the published page, and that is true here and nowhere else: the fix PR has merged (this
      # is a push to the default branch) and the page has been republished (a step above), in that order,
      # in one run. Running it from docs-feedback.yml would answer a reviewer about a branch nobody has
      # merged, which is why WorkflowTemplateTests forbids `docume sync` there.
      #
      # `--reply` is never in a bare `sync`, so the six-hourly cron in docs-sync.yml still writes nothing
      # to Confluence. This is the one scheduled write, and it needs no --space: it answers comments on
      # pages the state file already knows.
      #
      # LAST BEFORE THE CARRY, DELIBERATELY. `--reply` stamps `repliedAt` into each item the moment that
      # item's reply lands, and that stamp is all that stops the same reply being posted again. Every
      # step standing between the posting and the commit is a step whose failure turns one answered
      # comment into two, so the dashboard refresh goes first — it writes a Confluence page and nothing
      # in this repo, so losing it costs a stale table until the next run and nothing more.
      #
      # THE EXIT CODE IS HELD, NOT ALLOWED TO FAIL THE STEP, for the same reason. A run that posts six of
      # ten replies and then hits a 403 has six stamps on disk. Failing here would skip the carry step
      # and throw away both those stamps and the state file the publish wrote (which holds the pageId of
      # every page created in this run — lose it and the next publish creates them again). The last step
      # turns the held code into a red check, after the carry.
      #
      # AND IT IS SKIPPED WHEN THE PUBLISH FAILED, which the dashboard is not. The reply says the reviewer's
      # point is fixed in the page they are looking at; if the publish did not finish, that page may be one
      # it never reached, and the reply pass cannot tell — it reads triaged items and the live comments, not
      # this run's outcome. Skipping costs that reviewer one publish cycle and leaves their item un-stamped,
      # so the next green run answers it. Posting would leave a false claim under their comment, in the one
      # place nobody re-reads.
      - name: Answer the reviewers whose feedback shipped
        id: reply
        if: steps.publish.outputs.code == '0'
        run: |
          set -euo pipefail
          code=0
          dotnet tool run docume sync --reply || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The state write is not optional bookkeeping: it holds the pageId of every page and the sha the
      # next --changed-since narrows against. Lose it and the next run has no id for a page it created,
      # so it creates a second one. The feedback items ride along for the same kind of reason: `--reply`
      # stamps `repliedAt` into the item it answered, and that stamp is the only thing stopping the next
      # publish from posting the same reply again.
      #
      # It goes through a PR because direct pushes to a protected default branch do not work in this
      # org (§6.3's closing line). If yours lets the actions bot push, replace this step with a commit
      # and push to the default branch — one fewer PR to merge.
      #
      # If the docs/sync branch is behind and holds approvals this state file does not, they come back
      # on the next `docume sync`: approvals are reconstructible from the live labels, pageIds are not.
      # Merge the PR promptly and the window closes.
      - name: Carry the state file and the answered feedback into the docs/sync PR
        run: |
          set -euo pipefail
          state='${{ steps.paths.outputs.state }}'
          inbox='${{ steps.paths.outputs.inbox }}'
          archive='${{ steps.paths.outputs.archive }}'

          # All three paths, not the state alone. A push that changed no page body still stamps every
          # item the reply pass answered, and a guard watching only the state would call that "nothing
          # to do" and drop the stamps. `git status` rather than `git diff` because it sees an item that
          # is not tracked yet as well as one that was edited; a pathspec matching nothing is not an
          # error for it, so a repo that has never had feedback passes straight through.
          if [ -z "$(git status --porcelain -- "$state" "$inbox" "$archive")" ]; then
            echo "::notice title=DocuMe::State and feedback unchanged — no PR needed."
            exit 0
          fi

          # Copy aside, switch branches, copy back — the same dance as docs-sync.yml, and now the same
          # spelling: the docs/sync branch carries its own copy of every file below, so an unforced switch
          # aborts. Three collisions reach it, and `-f` is what covers all three: the state file modified
          # here, the archive items `--reply` edited in place (already tracked, since they arrived through
          # an earlier docs/sync PR, so a `git clean` would not touch them), and a state file that is
          # untracked here while tracked on the branch — the ordinary case until the first PR merges.
          cp "$state" "$RUNNER_TEMP/state.json"
          rm -rf "$RUNNER_TEMP/feedback"
          mkdir -p "$RUNNER_TEMP/feedback/inbox" "$RUNNER_TEMP/feedback/archive"
          if [ -d "$inbox" ]; then cp -R "$inbox/." "$RUNNER_TEMP/feedback/inbox/"; fi
          if [ -d "$archive" ]; then cp -R "$archive/." "$RUNNER_TEMP/feedback/archive/"; fi

          git fetch origin "$STATE_BRANCH" || true
          if git rev-parse --verify "origin/$STATE_BRANCH" >/dev/null 2>&1; then
            git checkout -f -B "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            git checkout -f -B "$STATE_BRANCH"
          fi

          cp "$RUNNER_TEMP/state.json" "$state"
          mkdir -p "$inbox" "$archive"
          cp -R "$RUNNER_TEMP/feedback/inbox/." "$inbox/"
          cp -R "$RUNNER_TEMP/feedback/archive/." "$archive/"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # An empty directory is not fatal to `git add`, and git stores no such thing, so a repo with no
          # feedback at all stages the state file and nothing else.
          git add "$state" "$inbox" "$archive"
          if git diff --cached --quiet; then
            echo "::notice title=DocuMe::Branch already holds this state and these replies."
            exit 0
          fi
          git commit -m "docs: DocuMe state after publishing ${GITHUB_SHA:0:7}"
          git push origin "$STATE_BRANCH"

          gh pr view "$STATE_BRANCH" --json number >/dev/null 2>&1 || gh pr create \
            --head "$STATE_BRANCH" \
            --title 'docs: DocuMe state' \
            --body 'Machine-owned state file (§5.3): page ids, versions, content hashes, approvals. Written by docs-publish.yml and docs-sync.yml. May also carry feedback items stamped `repliedAt` by the reply pass (§9 step 5) — that stamp is what stops the same reply being posted twice, so merge it rather than dropping it. Review the diff, then merge.'

      # THE ONE PLACE A FAILURE ABOVE BECOMES A RED CHECK, and it is last on purpose: by the time this runs,
      # everything the job earned — the page ids of pages that were created, the `repliedAt` stamps of the
      # replies that landed — is committed and on its way to the docs/sync PR. Skipped entirely when all
      # three commands were happy, so the usual run does not carry an extra step's noise.
      #
      # The codes come through `env:` rather than being interpolated into the script, so a value can never
      # be read as shell. One error line per failure, each saying what it cost and what a re-run will do,
      # because these annotations are all a consumer sees before opening the log.
      - name: Fail if DocuMe reported a failure
        if: steps.publish.outputs.code != '0' || steps.dashboard.outputs.code != '0' || steps.reply.outputs.code != '0'
        env:
          PUBLISH_CODE: ${{ steps.publish.outputs.code }}
          DASHBOARD_CODE: ${{ steps.dashboard.outputs.code }}
          REPLY_CODE: ${{ steps.reply.outputs.code }}
        run: |
          set -euo pipefail
          failed=0

          if [ "${PUBLISH_CODE:-0}" != '0' ]; then
            echo "::error title=DocuMe::\`docume publish\` exited ${PUBLISH_CODE} — see the \"Publish changed pages\" step. Every page it did publish is recorded in the state file, which the docs/sync PR above carries, so a re-run picks up where this one stopped instead of creating those pages twice. The reply pass was skipped: a reply must not claim a fix is live on a page this run may never have reached."
            failed=1
          fi

          if [ "${DASHBOARD_CODE:-0}" != '0' ]; then
            echo "::error title=DocuMe::\`docume dashboard\` exited ${DASHBOARD_CODE} — the Documentation Status page (§6.5) is stale until the next run. Nothing else in this run is affected: the dashboard writes a Confluence page and nothing in the repo."
            failed=1
          fi

          # A skipped step produces no output at all, so an empty code reads as "did not fail" — the reply is
          # skipped exactly when the publish failed, and that failure is already reported above.
          if [ "${REPLY_CODE:-0}" != '0' ]; then
            echo "::error title=DocuMe::Confluence refused at least one reply (§9 step 5) — see the \"Answer the reviewers whose feedback shipped\" step. The replies that did land are stamped and carried in the docs/sync PR, so a re-run answers only what is left."
            failed=1
          fi

          exit "$failed"
