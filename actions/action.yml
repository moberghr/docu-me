# DocuMe — the composite action PLAN.md §12 promises consumers (`moberghr/docu-me/actions@v1`):
# install the version of the CLI this repo is pinned to, then run it. It wraps the three lines every
# one of the six scaffolded workflows in `templates/workflows/` opens with, so a consumer writing a
# docs job of their own does not have to get them right a seventh time.
#
# WHY THE PIN IS THE POINT. `dotnet tool restore` installs whatever `.config/dotnet-tools.json` says,
# and `docume init` writes that manifest with the version of the tool that did the scaffolding. So the
# CLI a consumer's CI runs is the one their repo chose, not whatever is newest — and this action never
# names a DocuMe version, which is why it can float on `@v1` without pretending to pin anything.
#
# THE REF. The floating major tag is force-moved by the final step of `.github/workflows/release.yml` on
# each release (rule §8.2a), and the major is derived from the version rather than hardcoded: `@v0`
# tracks the newest 0.x today, §12's `@v1` goes live at 1.0.0, and a prerelease moves neither. An exact
# release tag, `moberghr/docu-me/actions@v0.1.0`, is there for a consumer who wants no float at all.
name: DocuMe
description: Run the repo-pinned DocuMe CLI — restores .config/dotnet-tools.json, then invokes docume.

inputs:
  args:
    description: >-
      Arguments for `docume`, as one string — e.g. `publish --dry-run` or
      `drift --format json`. Word-split into separate arguments, so it cannot carry a
      value containing spaces.
    required: true
  dotnet-version:
    description: >-
      SDK to install. The default matches what `docume init` scaffolds into
      templates/workflows/, and DocuMe.Cli targets net10.0 — override it only to install
      a newer SDK alongside.
    required: false
    default: '10.0.x'
  packages-token:
    description: >-
      Token for the GitHub Packages feed DocuMe.Cli is published to (PLAN.md §12). GitHub Packages
      authenticates every read, including a public package, so without it the restore below sees
      nuget.org alone and cannot find the pinned tool. The calling workflow's own GITHUB_TOKEN is
      enough from a repository in the same organisation as the package; from another org, a PAT with
      `read:packages`. A composite action cannot read `secrets` itself, which is why this is an input
      rather than something the action could have arranged on its own. Leave it empty only when the
      repo configures the feed another way, e.g. a committed NuGet.config.
    required: false
    default: ''
  mermaid:
    description: >-
      Whether to install the diagram renderer's toolchain (Node + beautiful-mermaid).
      `auto`, the default, installs it for the two invocations that render — `publish`, which
      always does, and `convert --render-mermaid`, which does only when asked — and skips it
      otherwise. `false` never installs it — correct, and a little faster, for a wiki with no
      ```mermaid fences. `true` always does.
    required: false
    default: 'auto'

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    # DocuMe.Cli is on GitHub Packages, not nuget.org (PLAN.md §12), and GitHub Packages authenticates
    # every read — a public package included. Skipped when no token is passed, because a repo whose
    # committed NuGet.config already names the feed needs nothing from us; the restore below is what
    # says so when that assumption turns out to be wrong.
    - name: Configure the DocuMe package feed
      if: inputs.packages-token != ''
      shell: bash
      env:
        FEED_USER: ${{ github.actor }}
        FEED_TOKEN: ${{ inputs.packages-token }}
      run: >-
        dotnet nuget add source https://nuget.pkg.github.com/moberghr/index.json
        --name docume
        --username "$FEED_USER"
        --password "$FEED_TOKEN"
        --store-password-in-clear-text

    # The guard, not decoration: `dotnet tool restore` in a repo with no manifest fails with the SDK's
    # own wording, which says nothing about DocuMe. A consumer who copied a workflow in by hand
    # instead of running `docume init` lands here, so this is the one place that can name the fix.
    #
    # The second refusal is the same argument for the other half. A restore that resolves the pin
    # against nuget.org alone fails with NuGet's "is not found in NuGet feeds", which names the feed it
    # DID look in and never the one it should have — so the consumer learns nothing about the token.
    - name: Restore the pinned docume
      shell: bash
      run: |
        set -euo pipefail

        if [ ! -f .config/dotnet-tools.json ]; then
          echo "::error::No .config/dotnet-tools.json — this repo has no pinned docume. Run \`docume init\` and commit the manifest (PLAN.md §6.1, §12)."
          exit 1
        fi

        if ! dotnet tool restore; then
          echo "::error::\`dotnet tool restore\` could not restore docume. DocuMe.Cli is published to GitHub Packages, which authenticates every read: pass the \`packages-token\` input (this repo's GITHUB_TOKEN in the same organisation as the package, otherwise a PAT with read:packages), or name the feed in a committed NuGet.config."
          exit 1
        fi

    # Two invocations shell out to Node and the renderer named by `mermaid.renderer`, once per ```mermaid
    # fence (PLAN.md §4, §6.2 step 3): every `publish`, and a `convert` carrying --render-mermaid. Neither
    # half of the toolchain is on a runner by default, so an action that installs only the SDK fails a wiki
    # holding one diagram with the renderer's exit 3, "cannot load beautiful-mermaid" — which is exactly
    # the bug the scaffolded docs-publish.yml shipped with. This action is the OTHER way a consumer runs
    # both, so it carries the same two steps rather than leaving them for a seventh consumer to get right.
    #
    # The subcommand alone settles publish and not convert, which is why the flag is read as well: a bare
    # `convert` renders nothing (ConvertCommand's --render-mermaid is off by default, because rendering
    # starts a process per diagram), so installing for it would charge every conversion for a toolchain it
    # never loads.
    #
    # Decided in a step rather than an `if:` on the two below: the condition is a word of an argument
    # string, which an expression cannot parse, and an unrecognised `mermaid` value must be a refusal
    # rather than a silent false — a typo that reads as "no renderer" rebuilds the same bug.
    - name: Decide whether the diagram renderer is needed
      id: renderer
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        MERMAID: ${{ inputs.mermaid }}
      run: |
        set -euo pipefail

        # The same word splitting the run step below relies on, used here to read the subcommand.
        # Positional, not `${ARGS%% *}`, so a leading space does not read as an empty first word.
        set -- $ARGS
        subcommand="${1:-}"

        case "$MERMAID" in
          true)  needed=true ;;
          false) needed=false ;;
          auto)
            needed=false

            if [ "$subcommand" = 'publish' ]; then
              needed=true
            fi

            # An explicit loop rather than a `case "$ARGS" in *--render-mermaid*)`: the flag has to be a
            # whole argument, so that a path or a title merely containing the word does not read as it.
            if [ "$subcommand" = 'convert' ]; then
              for word in "$@"; do
                if [ "$word" = '--render-mermaid' ]; then
                  needed=true
                fi
              done
            fi
            ;;
          *)
            echo "::error::mermaid must be auto, true or false — got '$MERMAID'."
            exit 1
            ;;
        esac

        echo "needed=$needed" >> "$GITHUB_OUTPUT"

    # The version is the one templates/tools/render-mermaid.mjs is written against; the renderer accepts a
    # subset of the mermaid dialect and that subset moves between releases, so a floating install would
    # change which of a consumer's diagrams render, on a nightly, with no commit to blame.
    - if: steps.renderer.outputs.needed == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # At the workspace root, not beside the renderer: Node resolves a dependency from the importing
    # script's own directory upwards, so a root node_modules/ is what the renderer actually finds.
    - name: Install the mermaid renderer's dependency
      if: steps.renderer.outputs.needed == 'true'
      shell: bash
      run: npm install --no-save beautiful-mermaid@1.1.3

    # `args` arrives as an environment variable rather than through `${{ }}` interpolated into the
    # script: a value spliced into the shell is a command-injection surface, and the caller of this
    # action is often a workflow passing something derived from an issue or a comment. Unquoted on
    # purpose — the word splitting is how one input string becomes an argv, which is the whole job.
    - name: docume ${{ inputs.args }}
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: dotnet tool run docume $ARGS
