# DocuMe — the composite action PLAN.md §12 promises consumers (`moberghr/docu-me/actions@v1`):
# install the version of the CLI this repo is pinned to, then run it. It wraps the three lines every
# one of the six scaffolded workflows in `templates/workflows/` opens with, so a consumer writing a
# docs job of their own does not have to get them right a seventh time.
#
# WHY THE PIN IS THE POINT. `dotnet tool restore` installs whatever `.config/dotnet-tools.json` says,
# and `docume init` writes that manifest with the version of the tool that did the scaffolding. So the
# CLI a consumer's CI runs is the one their repo chose, not whatever is newest — and this action never
# names a DocuMe version, which is why it can float on `@v1` without pretending to pin anything.
#
# THE REF. The floating major tag is force-moved by the final step of `.github/workflows/release.yml` on
# each release (rule §8.2a), and the major is derived from the version rather than hardcoded: `@v0`
# tracks the newest 0.x today, §12's `@v1` goes live at 1.0.0, and a prerelease moves neither. An exact
# release tag, `moberghr/docu-me/actions@v0.1.0`, is there for a consumer who wants no float at all.
name: DocuMe
description: Run the repo-pinned DocuMe CLI — restores .config/dotnet-tools.json, then invokes docume.

inputs:
  args:
    description: >-
      Arguments for `docume`, as one string — e.g. `publish --dry-run` or
      `drift --format json`. Word-split into separate arguments, so it cannot carry a
      value containing spaces.
    required: true
  dotnet-version:
    description: >-
      SDK to install. The default matches what `docume init` scaffolds into
      templates/workflows/, and DocuMe.Cli targets net10.0 — override it only to install
      a newer SDK alongside.
    required: false
    default: '10.0.x'
  mermaid:
    description: >-
      Whether to install the diagram renderer's toolchain (Node + beautiful-mermaid).
      `auto`, the default, installs it when `args` invokes `publish` and skips it otherwise,
      because publish is the only command that renders diagrams. `false` never installs it —
      correct, and a little faster, for a wiki with no ```mermaid fences. `true` always does.
    required: false
    default: 'auto'

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    # The guard, not decoration: `dotnet tool restore` in a repo with no manifest fails with the SDK's
    # own wording, which says nothing about DocuMe. A consumer who copied a workflow in by hand
    # instead of running `docume init` lands here, so this is the one place that can name the fix.
    - name: Restore the pinned docume
      shell: bash
      run: |
        set -euo pipefail

        if [ ! -f .config/dotnet-tools.json ]; then
          echo "::error::No .config/dotnet-tools.json — this repo has no pinned docume. Run \`docume init\` and commit the manifest (PLAN.md §6.1, §12)."
          exit 1
        fi

        dotnet tool restore

    # Publish is the ONLY DocuMe command that renders diagrams: it shells out to Node and the renderer
    # named by `mermaid.renderer` once per ```mermaid fence (PLAN.md §4, §6.2 step 3). Neither half is on
    # a runner by default, so an action that installs only the SDK fails a wiki holding one diagram with
    # the renderer's exit 3, "cannot load beautiful-mermaid" — which is exactly the bug the scaffolded
    # docs-publish.yml shipped with. This action is the OTHER way a consumer runs publish, so it carries
    # the same two steps rather than leaving them for a seventh consumer to get right.
    #
    # Decided in a step rather than an `if:` on the two below: the condition is the first word of an
    # argument string, which an expression cannot parse, and an unrecognised `mermaid` value must be a
    # refusal rather than a silent false — a typo that reads as "no renderer" rebuilds the same bug.
    - name: Decide whether the diagram renderer is needed
      id: renderer
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        MERMAID: ${{ inputs.mermaid }}
      run: |
        set -euo pipefail

        # The same word splitting the run step below relies on, used here to read the subcommand.
        # Positional, not `${ARGS%% *}`, so a leading space does not read as an empty first word.
        set -- $ARGS
        subcommand="${1:-}"

        case "$MERMAID" in
          true)  needed=true ;;
          false) needed=false ;;
          auto)
            needed=false
            if [ "$subcommand" = 'publish' ]; then
              needed=true
            fi
            ;;
          *)
            echo "::error::mermaid must be auto, true or false — got '$MERMAID'."
            exit 1
            ;;
        esac

        echo "needed=$needed" >> "$GITHUB_OUTPUT"

    # The version is the one templates/tools/render-mermaid.mjs is written against; the renderer accepts a
    # subset of the mermaid dialect and that subset moves between releases, so a floating install would
    # change which of a consumer's diagrams render, on a nightly, with no commit to blame.
    - if: steps.renderer.outputs.needed == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # At the workspace root, not beside the renderer: Node resolves a dependency from the importing
    # script's own directory upwards, so a root node_modules/ is what the renderer actually finds.
    - name: Install the mermaid renderer's dependency
      if: steps.renderer.outputs.needed == 'true'
      shell: bash
      run: npm install --no-save beautiful-mermaid@1.1.3

    # `args` arrives as an environment variable rather than through `${{ }}` interpolated into the
    # script: a value spliced into the shell is a command-injection surface, and the caller of this
    # action is often a workflow passing something derived from an issue or a comment. Unquoted on
    # purpose — the word splitting is how one input string becomes an argv, which is the whole job.
    - name: docume ${{ inputs.args }}
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: dotnet tool run docume $ARGS
